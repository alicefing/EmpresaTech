<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empresa TECH</title>
    <link rel="icon" type="image/png" href="./imagem/tecnologia.png">
    <link rel="stylesheet" href="index.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
          <img src="imagem/tecnologia.png" alt="Logo" style="height: 40px; margin-right: 10px;">
          <a class="navbar-brand" href="home.html">Empresa TECH</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNavbar" aria-controls="menuNavbar" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="menuNavbar">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" href="home.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="servicodesk.html">Serviço Desktop</a></li>
                <li class="nav-item"><a class="nav-link" href="servicomob.html">Serviço Mobile</a></li>
                <li class="nav-item"><a class="nav-link" href="contato.html">Contatos</a></li>
                <li class="nav-item"><a class="nav-link" href="sobre.html">Sobre</a></li>
            </ul>
          </div>
        </div>
    </nav>
    <section id="contato" class="container d-flex flex-column justify-content-center align-items-center" style="min-height: 80vh;">
        <h2 class="text-center mb-4">Entre em Contato</h2>
        <div class="row justify-content-center w-100">
            <div class="col-md-6">
                <div class="card p-4 shadow-sm border-0" style="background-color: #e8eaec; width: 100%; max-width: 400px; margin: 0 auto;">
                    <form>
                        <div class="mb-3">
                            <label for="exampleInputEmail1" class="form-label">Email</label>
                            <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
                            <div id="emailHelp" class="form-text"></div>
                        </div>
                        <div class="mb-3">
                            <label for="exampleInputPassword1" class="form-label">Senha</label>
                            <input type="password" class="form-control" id="exampleInputPassword1">
                        </div>
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="exampleCheck1">
                            <label class="form-check-label" for="exampleCheck1">Aceito os Termos de Uso</label>
                        </div>
                        <div class="d-flex justify-content-center">
                            <button type="submit" class="btn btn-primary">Enviar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>
    
    <footer class="text-white mt-5 p-4 text-center">
        <div class="social-section mb-4">
            <p>Siga-nos nas redes sociais:</p>
            <ul class="social-links list-unstyled d-flex justify-content-center">
                <li class="mx-2">
                    <a href="https://www.facebook.com" target="_blank">
                        <i class="bi bi-facebook" style="font-size: 40px; color: white;"></i>
                    </a>
                </li>
                <li class="mx-2">
                    <a href="https://www.instagram.com" target="_blank">
                        <i class="bi bi-instagram" style="font-size: 40px; color: white;"></i>
                    </a>
                </li>
                <li class="mx-2">
                    <a href="https://www.linkedin.com" target="_blank">
                        <i class="bi bi-linkedin" style="font-size: 40px; color: white;"></i>
                    </a>
                </li>
            </ul>
        </div>
        <div class="form-container mb-4">
            <form>
                <p class="form-text">Tem dúvidas?</p>
                <div class="input-container d-flex justify-content-center">
                    <input type="email" id="email" name="email" class="form-input form-control w-50 me-2" placeholder="seuemail@exemplo.com" required>
                    <button type="submit" class="btn btn-primary-2">Enviar</button>
                </div>
            </form>
        </div>
        <div class="copy-section">
            <p>&copy; 2025 Empresa Tech ES - todos os direitos reservados.</p>
        </div>
    </footer>

</body>
</html>
